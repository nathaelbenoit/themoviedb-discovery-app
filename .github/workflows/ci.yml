name: Continuous Integration
on:
  # when pushing to a feature branch, run the workflow
  push:
    branches:
      - feature/*
  # when creating a pull request to the main or develop branch, run the workflow
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: '🏗️ - lint and format'
    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v7
      - name: '🛠️ Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: '📦 Install dependencies'
        run: npm ci
      - name: '🎨 Run format check'
        run: npm run fmt:check
      - name: '🧹 Run lint'
        run: npm run lint
  unit-tests:
    runs-on: ubuntu-latest
    name: '🧪 - unit tests'
    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v7
      - name: '🛠️ Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: '📦 Install dependencies'
        run: npm ci
      - name: '🧪 Run unit tests'
        run: npm test
